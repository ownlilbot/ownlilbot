<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101b2b"/>
      <stop offset="55%" stop-color="#090f19"/>
      <stop offset="100%" stop-color="#07131c"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#007caa"/>
      <stop offset="50%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#75f3ff"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#142536"/>
      <stop offset="100%" stop-color="#0c1723"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none"
            stroke="#1b5264" stroke-opacity=".15" stroke-width=".7"/>
    </pattern>
  </defs>

  <!-- BACKGROUND -->
  <rect width="800" height="440" rx="20" fill="url(#background)"/>
  <rect width="800" height="440" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="798" height="438" rx="19"
        fill="none" stroke="#17617a" stroke-opacity=".65"/>

  <!-- DECORATIVE ELEMENTS -->
  <path d="M20 2H250" stroke="url(#accent)" stroke-width="2" opacity=".8"/>
  <circle cx="750" cy="45" r="85" fill="#00bce8" opacity=".025"/>

  <!-- HEADER -->
  <rect x="32" y="28" width="4" height="48" rx="2" fill="url(#accent)"/>

  <text x="50" y="49" fill="#eafaff"
        font-family="Arial, sans-serif" font-size="22"
        font-weight="bold" letter-spacing="1.2">
    XLILNYX OFFICIAL
  </text>

  <text x="51" y="69" fill="#819aaa"
        font-family="Arial, sans-serif" font-size="9"
        letter-spacing="2.3">
    SKILL ANALYTICS DATABASE
  </text>
  
<rect x="590" y="33" width="177" height="29" rx="7"
      fill="#073047" stroke="#087b9c" stroke-opacity=".8"/>
<circle cx="605" cy="47.5" r="3" fill="#00e5ff" filter="url(#glow)"/>
<text x="617" y="51" fill="#8deeff"
      font-family="Arial, sans-serif" font-size="8"
      font-weight="bold" letter-spacing=".7">
  DATABASE SKILLS PROFILE
</text>

  <line x1="32" y1="91" x2="768" y2="91"
        stroke="#294355" stroke-width="1"/>

  <!-- SUMMARY PANEL -->
  <rect x="32" y="108" width="736" height="72" rx="10"
        fill="url(#panel)" stroke="#21475b"/>

  <!-- PROGRAMMING SKILLS -->
  <text x="140" y="135" text-anchor="middle" fill="#819aaa"
        font-family="Arial, sans-serif" font-size="9"
        letter-spacing="1.2">
    PROGRAMMING SKILLS
  </text>
  <text x="140" y="161" text-anchor="middle" fill="#f0fbff"
        font-family="Arial, sans-serif" font-size="21"
        font-weight="bold">
    04
  </text>

  <line x1="260" y1="122" x2="260" y2="166" stroke="#294355"/>

  <!-- PROFILE CATEGORY -->
  <text x="445" y="135" text-anchor="middle" fill="#819aaa"
        font-family="Arial, sans-serif" font-size="9"
        letter-spacing="1.2">
    PROFILE CATEGORY
  </text>
  <text x="445" y="160" text-anchor="middle" fill="#00d9ff"
        font-family="Arial, sans-serif" font-size="13"
        font-weight="bold">
    MONITORING &amp; SOFTWARE DEVELOPMENT
  </text>

  <line x1="630" y1="122" x2="630" y2="166" stroke="#294355"/>

  <!-- SYSTEM STATUS -->
  <text x="698" y="135" text-anchor="middle" fill="#819aaa"
        font-family="Arial, sans-serif" font-size="9"
        letter-spacing="1">
    SYSTEM STATUS
  </text>
  <text x="698" y="160" text-anchor="middle" fill="#75e8c3"
        font-family="Arial, sans-serif" font-size="11"
        font-weight="bold">
    PERSONAL PROFILE
  </text>

  <!-- SKILL 01 -->
  <rect x="32" y="210" width="736" height="43" rx="8"
        fill="#102131" stroke="#1b3a4c"/>
  <text x="52" y="236" fill="#63879a"
        font-family="Arial, sans-serif" font-size="10"
        font-weight="bold">01</text>
  <text x="88" y="236" fill="#e8f5fa"
        font-family="Arial, sans-serif" font-size="12"
        font-weight="bold">HTML &amp; CSS</text>
  <rect x="275" y="228" width="350" height="7" rx="3.5" fill="#263b4b"/>
  <rect x="275" y="228" width="315" height="7" rx="3.5"
        fill="url(#accent)" filter="url(#glow)"/>
  <text x="746" y="236" text-anchor="end" fill="#00dfff"
        font-family="Arial, sans-serif" font-size="12"
        font-weight="bold">90%</text>

  <!-- SKILL 02 -->
  <rect x="32" y="264" width="736" height="43" rx="8"
        fill="#102131" stroke="#1b3a4c"/>
  <text x="52" y="290" fill="#63879a"
        font-family="Arial, sans-serif" font-size="10"
        font-weight="bold">02</text>
  <text x="88" y="290" fill="#e8f5fa"
        font-family="Arial, sans-serif" font-size="12"
        font-weight="bold">JAVASCRIPT</text>
  <rect x="275" y="282" width="350" height="7" rx="3.5" fill="#263b4b"/>
  <rect x="275" y="282" width="280" height="7" rx="3.5"
        fill="url(#accent)" filter="url(#glow)"/>
  <text x="746" y="290" text-anchor="end" fill="#00dfff"
        font-family="Arial, sans-serif" font-size="12"
        font-weight="bold">80%</text>

  <!-- SKILL 03 -->
  <rect x="32" y="318" width="736" height="43" rx="8"
        fill="#102131" stroke="#1b3a4c"/>
  <text x="52" y="344" fill="#63879a"
        font-family="Arial, sans-serif" font-size="10"
        font-weight="bold">03</text>
  <text x="88" y="344" fill="#e8f5fa"
        font-family="Arial, sans-serif" font-size="12"
        font-weight="bold">PYTHON</text>
  <rect x="275" y="336" width="350" height="7" rx="3.5" fill="#263b4b"/>
  <rect x="275" y="336" width="262.5" height="7" rx="3.5"
        fill="url(#accent)" filter="url(#glow)"/>
  <text x="746" y="344" text-anchor="end" fill="#00dfff"
        font-family="Arial, sans-serif" font-size="12"
        font-weight="bold">75%</text>

  <!-- SKILL 04 -->
  <rect x="32" y="372" width="736" height="43" rx="8"
        fill="#102131" stroke="#1b3a4c"/>
  <text x="52" y="398" fill="#63879a"
        font-family="Arial, sans-serif" font-size="10"
        font-weight="bold">04</text>
  <text x="88" y="398" fill="#e8f5fa"
        font-family="Arial, sans-serif" font-size="12"
        font-weight="bold">PHP</text>
  <rect x="275" y="390" width="350" height="7" rx="3.5" fill="#263b4b"/>
  <rect x="275" y="390" width="238" height="7" rx="3.5"
        fill="url(#accent)" filter="url(#glow)"/>
  <text x="746" y="398" text-anchor="end" fill="#00dfff"
        font-family="Arial, sans-serif" font-size="12"
        font-weight="bold">68%</text>

  <!-- FOOTER -->
  <line x1="32" y1="426" x2="768" y2="426" stroke="#1d3546"/>
  <text x="400" y="435" text-anchor="middle" fill="#648397"
        font-family="Arial, sans-serif" font-size="7"
        letter-spacing="1.5">
    MADE BY XLILNYX OFFICIAL  </text>
</svg>
