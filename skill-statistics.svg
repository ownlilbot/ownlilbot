
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b2b"/>
      <stop offset="0.55" stop-color="#090f19"/>
      <stop offset="1" stop-color="#07131c"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#007caa"/>
      <stop offset="0.5" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#75f3ff"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#142536"/>
      <stop offset="1" stop-color="#0c1723"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1b5264" stroke-opacity=".18" stroke-width=".7"/>
    </pattern>
  </defs>

  <!-- BACKGROUND -->
  <rect width="800" height="440" rx="20" fill="url(#background)"/>
  <rect width="800" height="440" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="798" height="438" rx="19"
        fill="none" stroke="#17617a" stroke-opacity=".7"/>

  <!-- DECORATIVE LIGHT -->
  <path d="M0 0H300L190 3H0Z" fill="#00d9ff" opacity=".8"/>
  <circle cx="740" cy="40" r="90" fill="#00bce8" opacity=".035"/>

  <!-- HEADER -->
  <rect x="30" y="28" width="5" height="52" rx="2.5" fill="url(#accent)"/>

  <text x="50" y="51" fill="#eafaff" font-family="Arial"
        font-size="23" font-weight="bold" letter-spacing="1.2">
    XLILNYX OFFICIAL
  </text>

  <text x="51" y="72" fill="#7e9aaa" font-family="Arial"
        font-size="10" letter-spacing="2.5">
    DEVELOPER SKILL ANALYTICS
  </text>

  <rect x="630" y="35" width="137" height="30" rx="8"
        fill="#073047" stroke="#087b9c" stroke-opacity=".8"/>
  <circle cx="646" cy="50" r="3.5" fill="#00e5ff" filter="url(#glow)"/>
  <text x="658" y="54" fill="#8deeff" font-family="Arial"
        font-size="10" font-weight="bold" letter-spacing="1">
    SKILL PROFILE
  </text>

  <line x1="30" y1="100" x2="770" y2="100"
        stroke="#244052" stroke-width="1"/>

  <!-- SUMMARY PANEL -->
  <rect x="30" y="116" width="740" height="67" rx="11"
        fill="url(#panel)" stroke="#21475b"/>

  <text x="52" y="141" fill="#7895a7" font-family="Arial"
        font-size="9" letter-spacing="1.5">
    PROGRAMMING SKILLS
  </text>
  <text x="52" y="163" fill="#f0fbff" font-family="Arial"
        font-size="19" font-weight="bold">
    04
  </text>

  <line x1="190" y1="130" x2="190" y2="169" stroke="#294355"/>

  <text x="214" y="141" fill="#7895a7" font-family="Arial"
        font-size="9" letter-spacing="1.5">
    PROFILE CATEGORY
  </text>
  <text x="214" y="163" fill="#00d9ff" font-family="Arial"
        font-size="15" font-weight="bold">
    WEB &amp; SOFTWARE DEVELOPMENT
  </text>

  <line x1="558" y1="130" x2="558" y2="169" stroke="#294355"/>

  <text x="580" y="141" fill="#7895a7" font-family="Arial"
        font-size="9" letter-spacing="1.5">
    SYSTEM STATUS
  </text>
  <text x="580" y="163" fill="#75e8c3" font-family="Arial"
        font-size="13" font-weight="bold">
    PERSONAL PROFILE
  </text>

  <!-- SECTION TITLE -->
  <text x="34" y="218" fill="#dff8ff" font-family="Arial"
        font-size="12" font-weight="bold" letter-spacing="1.8">
    TECHNICAL PROFICIENCY
  </text>
  <text x="766" y="218" text-anchor="end" fill="#668497"
        font-family="Arial" font-size="9" letter-spacing="1">
    SKILL DISTRIBUTION
  </text>

  <!-- HTML & CSS -->
  <rect x="30" y="234" width="740" height="39" rx="7"
        fill="#102131" stroke="#1b3a4c"/>
  <text x="47" y="258" fill="#63879a" font-family="Arial"
        font-size="10" font-weight="bold">01</text>
  <text x="82" y="258" fill="#e8f5fa" font-family="Arial"
        font-size="12" font-weight="bold">HTML &amp; CSS</text>
  <rect x="275" y="249" width="350" height="7" rx="3.5" fill="#263b4b"/>
  <rect x="275" y="249" width="315" height="7" rx="3.5"
        fill="url(#accent)" filter="url(#glow)"/>
  <text x="746" y="258" text-anchor="end" fill="#00dfff"
        font-family="Arial" font-size="13" font-weight="bold">90%</text>

  <!-- JAVASCRIPT -->
  <rect x="30" y="282" width="740" height="39" rx="7"
        fill="#102131" stroke="#1b3a4c"/>
  <text x="47" y="306" fill="#63879a" font-family="Arial"
        font-size="10" font-weight="bold">02</text>
  <text x="82" y="306" fill="#e8f5fa" font-family="Arial"
        font-size="12" font-weight="bold">JAVASCRIPT</text>
  <rect x="275" y="297" width="350" height="7" rx="3.5" fill="#263b4b"/>
  <rect x="275" y="297" width="280" height="7" rx="3.5"
        fill="url(#accent)" filter="url(#glow)"/>
  <text x="746" y="306" text-anchor="end" fill="#00dfff"
        font-family="Arial" font-size="13" font-weight="bold">80%</text>

  <!-- PYTHON -->
  <rect x="30" y="330" width="740" height="39" rx="7"
        fill="#102131" stroke="#1b3a4c"/>
  <text x="47" y="354" fill="#63879a" font-family="Arial"
        font-size="10" font-weight="bold">03</text>
  <text x="82" y="354" fill="#e8f5fa" font-family="Arial"
        font-size="12" font-weight="bold">PYTHON</text>
  <rect x="275" y="345" width="350" height="7" rx="3.5" fill="#263b4b"/>
  <rect x="275" y="345" width="262.5" height="7" rx="3.5"
        fill="url(#accent)" filter="url(#glow)"/>
  <text x="746" y="354" text-anchor="end" fill="#00dfff"
        font-family="Arial" font-size="13" font-weight="bold">75%</text>

  <!-- PHP -->
  <rect x="30" y="378" width="740" height="39" rx="7"
        fill="#102131" stroke="#1b3a4c"/>
  <text x="47" y="402" fill="#63879a" font-family="Arial"
        font-size="10" font-weight="bold">04</text>
  <text x="82" y="402" fill="#e8f5fa" font-family="Arial"
        font-size="12" font-weight="bold">PHP</text>
  <rect x="275" y="393" width="350" height="7" rx="3.5" fill="#263b4b"/>
  <rect x="275" y="393" width="238" height="7" rx="3.5"
        fill="url(#accent)" filter="url(#glow)"/>
  <text x="746" y="402" text-anchor="end" fill="#00dfff"
        font-family="Arial" font-size="13" font-weight="bold">68%</text>
</svg>
