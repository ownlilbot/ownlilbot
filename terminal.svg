
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340"
     viewBox="0 0 1200 340">

  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#310713"/>
      <stop offset=".55" stop-color="#10050b"/>
      <stop offset="1" stop-color="#020307"/>
    </radialGradient>

    <linearGradient id="red">
      <stop stop-color="#8b001d"/>
      <stop offset=".5" stop-color="#ff1744"/>
      <stop offset="1" stop-color="#ff8191"/>
    </linearGradient>

    <linearGradient id="beam" x2="0" y2="1">
      <stop stop-color="#ff1744" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff1744" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff1744" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none"
            stroke="#8d1630" stroke-opacity=".25"/>
    </pattern>

    <pattern id="scanlines" width="4" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 0H4" stroke="#ff3154" stroke-opacity=".12"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="screen">
      <rect width="1200" height="340" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#screen)">

    <!-- BACKGROUND -->
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#scanlines)"/>

    <!-- ATMOSPHERIC GLOW -->
    <ellipse cx="600" cy="170" rx="420" ry="115"
             fill="#ff002e" opacity=".09">
      <animate attributeName="opacity"
               values=".04;.15;.05"
               dur="1.7s" repeatCount="indefinite"/>
    </ellipse>

    <!-- BACKGROUND LINES -->
    <g stroke="#ff1744" fill="none" opacity=".35">
      <path d="M0 65H1200M0 275H1200"/>
      <path d="M75 0V340M1125 0V340"/>
      <path d="M0 120H240M960 120H1200"/>
      <path d="M0 220H180M1020 220H1200"/>
    </g>

    <!-- DIGITAL GLITCH BLOCKS -->
    <g fill="#ff1744">
      <rect x="80" y="92" width="95" height="5" opacity=".65">
        <animate attributeName="x"
                 values="80;160;45;80"
                 dur=".8s" repeatCount="indefinite"/>
      </rect>

      <rect x="1010" y="245" width="110" height="4" opacity=".55">
        <animate attributeName="x"
                 values="1010;940;1080;1010"
                 dur="1.1s" repeatCount="indefinite"/>
      </rect>

      <rect x="230" y="255" width="35" height="7" opacity=".5"/>
      <rect x="930" y="78" width="55" height="5" opacity=".6"/>
      <rect x="160" y="190" width="18" height="3" opacity=".8"/>
      <rect x="1030" y="165" width="25" height="4" opacity=".8"/>
    </g>

    <!-- MAIN TEXT GLOW -->
    <text x="600" y="190"
          text-anchor="middle"
          font-family="monospace"
          font-size="48"
          font-weight="900"
          letter-spacing="3"
          fill="#ff1744"
          filter="url(#strongGlow)">XLILNYX OFFICIAL IN HERE</text>

    <!-- MAIN TEXT -->
    <text x="600" y="190"
          text-anchor="middle"
          font-family="monospace"
          font-size="48"
          font-weight="900"
          letter-spacing="3"
          fill="url(#red)"
          filter="url(#glow)">
      XLILNYX OFFICIAL IN HERE
      <animate attributeName="opacity"
               values="1;.75;1;.35;1"
               dur="2.4s"
               repeatCount="indefinite"/>
    </text>

    <!-- CYAN GLITCH -->
    <text x="600" y="190"
          text-anchor="middle"
          font-family="monospace"
          font-size="48"
          font-weight="900"
          letter-spacing="3"
          fill="#00eaff"
          opacity="0">
      XLILNYX OFFICIAL IN HERE
      <animate attributeName="opacity"
               values="0;0;.9;0;.6;0;0"
               dur="2.2s"
               repeatCount="indefinite"/>
      <animateTransform attributeName="transform"
                        type="translate"
                        values="-9 0;8 0;-5 0;0 0"
                        dur=".35s"
                        repeatCount="indefinite"/>
    </text>

    <!-- RED GLITCH -->
    <text x="600" y="190"
          text-anchor="middle"
          font-family="monospace"
          font-size="48"
          font-weight="900"
          letter-spacing="3"
          fill="#ff003c"
          opacity="0">
      XLILNYX OFFICIAL IN HERE
      <animate attributeName="opacity"
               values="0;.8;0;0;.5;0"
               dur="1.7s"
               repeatCount="indefinite"/>
      <animateTransform attributeName="transform"
                        type="translate"
                        values="8 0;-6 0;4 0;0 0"
                        dur=".4s"
                        repeatCount="indefinite"/>
    </text>

    <!-- MOVING SCAN BEAM -->
    <rect x="0" y="-100" width="1200" height="75"
          fill="url(#beam)">
      <animate attributeName="y"
               from="-100" to="380"
               dur="2.8s"
               repeatCount="indefinite"/>
    </rect>

    <!-- HORIZONTAL INTERFERENCE -->
    <g fill="#ff3154">
      <rect x="0" y="105" width="1200" height="2">
        <animate attributeName="opacity"
                 values=".1;.9;.1;0;.7"
                 dur=".8s"
                 repeatCount="indefinite"/>
      </rect>

      <rect x="0" y="230" width="1200" height="2">
        <animate attributeName="opacity"
                 values=".8;.1;.9;.2"
                 dur="1.1s"
                 repeatCount="indefinite"/>
      </rect>

      <rect x="0" y="150" width="1200" height="1">
        <animate attributeName="y"
                 values="150;155;145;150"
                 dur=".3s"
                 repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- SCREEN DISTORTION -->
    <g opacity="0">
      <rect x="0" y="135" width="1200" height="24"
            fill="#ff1744"/>
      <animate attributeName="opacity"
               values="0;0;.12;0;0"
               dur="1.9s"
               repeatCount="indefinite"/>
    </g>

    <!-- SIDE WARNING MARKS -->
    <g stroke="#ff294b" fill="none" opacity=".85">
      <path d="M90 170H200M1000 170H1110"/>
      <path d="M120 150V190M1080 150V190"/>
      <path d="M90 85H150M1050 85H1110"/>
      <path d="M90 255H150M1050 255H1110"/>
    </g>

    <!-- MOVING RED LIGHT -->
    <circle cy="170" r="4"
            fill="#ff1744"
            filter="url(#glow)">
      <animate attributeName="cx"
               values="100;1100;100"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <!-- FLICKERING SCREEN -->
    <rect width="1200" height="340"
          fill="#ff002e" opacity="0">
      <animate attributeName="opacity"
               values="0;0;.07;0;0;.12;0"
               dur="3s"
               repeatCount="indefinite"/>
    </rect>

    <!-- BORDER -->
    <rect x="1" y="1" width="1198" height="338"
          rx="13"
          fill="none"
          stroke="#bd1838"
          stroke-width="1.5"/>

    <rect x="7" y="7" width="1186" height="326"
          rx="10"
          fill="none"
          stroke="#ff1744"
          stroke-opacity=".15"/>

  </g>
</svg>
