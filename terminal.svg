<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <radialGradient id="bg">
      <stop offset="0" stop-color="#260008"/>
      <stop offset="0.55" stop-color="#100006"/>
      <stop offset="1" stop-color="#020204"/>
    </radialGradient>

    <linearGradient id="red">
      <stop stop-color="#5a0010"/>
      <stop offset=".5" stop-color="#ff002f"/>
      <stop offset="1" stop-color="#7a0018"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="heavyGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ff123d" stroke-opacity=".09" stroke-width="1"/>
    </pattern>

    <pattern id="scanlines" width="3" height="6" patternUnits="userSpaceOnUse">
      <rect width="3" height="2" fill="#ff1a3d" opacity=".12"/>
    </pattern>

    <clipPath id="screen">
      <rect x="35" y="35" width="1130" height="730" rx="8"/>
    </clipPath>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <g clip-path="url(#screen)">
    <circle cx="600" cy="400" r="360" fill="#b00025" opacity=".12" filter="url(#heavyGlow)"/>

    <path d="M0 130H1200 M0 670H1200" stroke="#ff003c" opacity=".2"/>
    <path d="M0 180H1200 M0 620H1200" stroke="#ff003c" opacity=".12"/>

    <g fill="#ff1744" font-family="monospace" font-weight="bold">
      <text x="70" y="100" font-size="19" opacity=".8">FATAL_EXCEPTION // SYSTEM_FAILURE</text>
      <text x="1130" y="100" text-anchor="end" font-size="17" opacity=".65">ERR_0x000F</text>
      <text x="70" y="710" font-size="16" opacity=".7">CRITICAL ERROR DETECTED</text>
      <text x="1130" y="710" text-anchor="end" font-size="16" opacity=".7">SYSTEM OFFLINE</text>
    </g>

    <g stroke="#ff1744" fill="none" opacity=".7">
      <path d="M70 125H260L280 145H390"/>
      <path d="M1130 125H940L920 145H810"/>
      <path d="M70 680H260L280 660H390"/>
      <path d="M1130 680H940L920 660H810"/>
    </g>

    <g font-family="monospace" font-weight="bold" text-anchor="middle">
      <text x="600" y="385" font-size="65" fill="#00eaff" opacity=".75">
        XLILNYX OFFICIAL IN HERE
        <animate attributeName="x" values="600;608;590;600" dur=".18s" repeatCount="indefinite"/>
      </text>

      <text x="600" y="385" font-size="65" fill="#ff003c" opacity=".8">
        XLILNYX OFFICIAL IN HERE
        <animate attributeName="x" values="600;590;610;600" dur=".14s" repeatCount="indefinite"/>
      </text>

      <text x="600" y="385" font-size="65" fill="#fff0f2" filter="url(#glow)">
        XLILNYX OFFICIAL IN HERE
        <animate attributeName="opacity" values="1;1;.45;1;0.8;1" dur="2.4s" repeatCount="indefinite"/>
      </text>
    </g>

    <g fill="#ff1744" font-family="monospace" font-size="18" font-weight="bold">
      <text x="600" y="455" text-anchor="middle">[ ACCESS DENIED ]</text>
      <text x="600" y="490" text-anchor="middle" opacity=".75">SYSTEM INTEGRITY COMPROMISED</text>
    </g>

    <g stroke="#ff1744" stroke-width="2" opacity=".8">
      <path d="M180 420H370 M830 420H1020"/>
      <path d="M250 435H410 M790 435H950"/>
    </g>

    <g fill="#ff1744" opacity=".7">
      <rect x="80" y="230" width="140" height="4"/>
      <rect x="980" y="260" width="130" height="4"/>
      <rect x="120" y="550" width="180" height="3"/>
      <rect x="900" y="575" width="200" height="3"/>
    </g>

    <g stroke="#ff003c" opacity=".5">
      <path d="M0 300H1200 M0 510H1200"/>
      <path d="M0 302H1200 M0 512H1200" stroke-width="3" opacity=".25"/>
    </g>

    <rect x="0" y="0" width="1200" height="800" fill="url(#scanlines)"/>

    <rect x="-1200" y="0" width="1200" height="5" fill="#ff1744" opacity=".7">
      <animate attributeName="x" from="-1200" to="1200" dur="4s" repeatCount="indefinite"/>
    </rect>

    <g fill="#ff1744" opacity=".6">
      <rect x="0" y="350" width="1200" height="3">
        <animate attributeName="y" values="350;370;345;350" dur=".3s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="395" width="1200" height="2" opacity=".5">
        <animate attributeName="y" values="395;410;390;395" dur=".22s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g fill="#ff1744" font-family="monospace" font-size="13" opacity=".5">
      <text x="75" y="755">0xFF 0x00 0xERROR 0x13 0xCRITICAL</text>
      <text x="1125" y="755" text-anchor="end">CONNECTION LOST // RETRY FAILED</text>
    </g>
  </g>

  <rect x="35" y="35" width="1130" height="730" rx="8" fill="none" stroke="#ff1744" stroke-width="2" opacity=".8" filter="url(#glow)"/>
  <rect x="43" y="43" width="1114" height="714" rx="5" fill="none" stroke="#7a0018" stroke-width="1"/>
</svg>
