
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340">
  <defs>
    <radialGradient id="bg">
      <stop offset="0" stop-color="#260811"/>
      <stop offset="1" stop-color="#030407"/>
    </radialGradient>
    <linearGradient id="red">
      <stop stop-color="#ff1744"/>
      <stop offset=".5" stop-color="#ff6478"/>
      <stop offset="1" stop-color="#a00025"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#651326" opacity=".3"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="screen">
      <rect width="1000" height="340" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#screen)">
    <rect width="1000" height="340" fill="url(#bg)"/>
    <rect width="1000" height="340" fill="url(#grid)"/>

    <g stroke="#ff2448" opacity=".3">
      <path d="M0 65H1000M0 275H1000"/>
      <path d="M65 0V340M935 0V340"/>
    </g>

    <text x="500" y="190" text-anchor="middle"
      font-family="monospace" font-size="112"
      font-weight="900" letter-spacing="7"
      fill="#ff1744" filter="url(#glow)">404 ERROR</text>

    <text x="500" y="190" text-anchor="middle"
      font-family="monospace" font-size="112"
      font-weight="900" letter-spacing="7"
      fill="#00eaff" opacity="0">
      404 ERROR
      <animate attributeName="opacity"
        values="0;0;.8;0;0" dur="2.8s"
        repeatCount="indefinite"/>
      <animateTransform attributeName="transform"
        type="translate" values="-7 0;7 0;-3 0;0 0"
        dur="2.8s" repeatCount="indefinite"/>
    </text>

    <rect x="-250" y="0" width="220" height="340"
      fill="#ff2448" opacity=".08">
      <animate attributeName="x"
        from="-250" to="1050" dur="4s"
        repeatCount="indefinite"/>
    </rect>

    <rect x="0" y="0" width="1000" height="2"
      fill="#ff3658" opacity=".7">
      <animate attributeName="y"
        values="-5;345" dur="3.5s"
        repeatCount="indefinite"/>
    </rect>

    <g opacity=".7" fill="#ff2448">
      <rect x="0" y="105" width="1000" height="1">
        <animate attributeName="opacity"
          values=".1;.8;.1" dur="1.3s"
          repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="230" width="1000" height="2">
        <animate attributeName="opacity"
          values=".8;.1;.8" dur="1.8s"
          repeatCount="indefinite"/>
      </rect>
    </g>

    <g stroke="#ff294b" fill="none" opacity=".7">
      <path d="M90 170H200M800 170H910"/>
      <path d="M120 155V185M880 155V185"/>
    </g>

    <rect x="1" y="1" width="998" height="338"
      rx="13" fill="none" stroke="#bd1838"/>
  </g>
</svg>
